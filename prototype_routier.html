<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Compagnon routier — prototype</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7fd;color:#102347;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:480px;min-height:100dvh;margin:auto;background:white;padding:24px 22px 165px;position:relative}header{text-align:center;margin:22px 0 38px}h1{font-size:29px;margin:0 0 8px}header p{color:#64748b;margin:0}.ring{height:270px;width:270px;max-width:100%;border-radius:50%;border:13px solid #e9f1ff;border-top-color:#2378ff;border-right-color:#2378ff;display:flex;flex-direction:column;justify-content:center;align-items:center;margin:0 auto 34px}.big{font-size:52px;font-weight:750;letter-spacing:-2px}.sub{color:#64748b}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{border:1px solid #eef1f7;border-radius:18px;padding:18px 12px;text-align:center;box-shadow:0 4px 18px #1b37610a}.stat span{font-size:13px;color:#64748b}.stat strong{display:block;margin-top:8px;font-size:24px}.status{text-align:center;margin:22px 0;color:#526580;font-size:14px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:white;padding:12px 22px max(18px,env(safe-area-inset-bottom));border-top:1px solid #edf0f5}.primary{width:100%;padding:19px;border:0;border-radius:17px;background:#2478ff;color:white;font-size:17px;font-weight:700}.secondary{width:100%;background:white;border:1px solid #d9e4f5;border-radius:14px;padding:14px;color:#27446c;font-size:15px;margin-top:10px}.nav{display:flex;justify-content:space-around;margin-top:19px;color:#73829a;font-size:12px}.nav b{color:#2378ff}button{cursor:pointer}#history{margin-top:25px;font-size:13px;color:#53647e}#history div{padding:9px 0;border-bottom:1px solid #eef1f7}small{display:block;text-align:center;color:#8390a4;margin-top:14px}</style></head><body><main class="app"><header><h1>Bonjour 👋</h1><p id="date"></p></header><section class="ring"><div class="big" id="worked">0h 00</div><div class="sub">travail aujourd'hui</div></section><section class="stats"><div class="stat"><span>☕ Pauses</span><strong id="breaks">0h 00</strong></div><div class="stat"><span>▥ Total semaine</span><strong id="week">0h 00</strong></div></section><p class="status" id="status">Journée non démarrée</p><section id="history"></section><small>Suivi personnel indicatif • pas un tachygraphe</small></main><div class="bottom"><button class="primary" id="action">▶ Démarrer ma journée</button><button class="secondary" id="end" hidden>Terminer ma journée</button><nav class="nav"><b>⌂ Accueil</b><span>▤ Activité</span><span>◷ RSE</span><span>◉ Salaire</span></nav></div><script>
const key='routier-prototype-v1',now=()=>Date.now(),today=()=>new Date().toLocaleDateString('sv-SE'),dayLabel=()=>new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});let data;try{data=JSON.parse(localStorage.getItem(key))}catch(e){}if(!data||!Array.isArray(data.segments))data={segments:[],mode:'idle',since:null};const save=()=>localStorage.setItem(key,JSON.stringify(data));const fmt=ms=>{let m=Math.floor(Math.max(0,ms)/60000);return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')};function sum(type,from,to){let t=0;for(let s of data.segments){if(s.type!==type)continue;t+=Math.max(0,Math.min(s.end,to)-Math.max(s.start,from))}if(data.mode===type&&data.since!==null)t+=Math.max(0,Math.min(now(),to)-Math.max(data.since,from));return t}function bounds(){let d=new Date();d.setHours(0,0,0,0);let start=d.getTime(),week=new Date(d);week.setDate(week.getDate()-(week.getDay()+6)%7);return {start,week:week.getTime()}}function render(){let {start,week}=bounds();document.querySelector('#date').textContent=dayLabel();document.querySelector('#worked').textContent=fmt(sum('work',start,now()));document.querySelector('#breaks').textContent=fmt(sum('pause',start,now()));document.querySelector('#week').textContent=fmt(sum('work',week,now()));document.querySelector('#status').textContent={idle:'Journée non démarrée',work:'● Journée en cours',pause:'Ⅱ Pause en cours',done:'Journée terminée'}[data.mode];let a=document.querySelector('#action'),end=document.querySelector('#end');a.textContent={idle:'▶ Démarrer ma journée',work:'Ⅱ Prendre une pause',pause:'▶ Reprendre le travail',done:'▶ Démarrer une nouvelle journée'}[data.mode];end.hidden=!['work','pause'].includes(data.mode);let recent=data.segments.filter(s=>s.end>=start).slice(-4).reverse();document.querySelector('#history').innerHTML=recent.length?'<b>Dernières activités</b>'+recent.map(s=>'<div>'+ (s.type==='work'?'Travail':'Pause')+' · '+new Date(s.start).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+' – '+new Date(s.end).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+'</div>').join(''):''}function switchTo(mode){let t=now();if(data.since!==null&&['work','pause'].includes(data.mode))data.segments.push({type:data.mode,start:data.since,end:t});data.mode=mode;data.since=['work','pause'].includes(mode)?t:null;save();render()}document.querySelector('#action').onclick=()=>switchTo(data.mode==='work'?'pause':'work');document.querySelector('#end').onclick=()=>{if(confirm('Terminer la journée ?'))switchTo('done')};render();setInterval(render,15000);
</script></body></html>
